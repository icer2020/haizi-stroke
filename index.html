<title>汉字笔画演示 - 阳阳学汉字</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4299e1">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 90%; }
h1 { font-size: 24px; color: #2d3748; margin-bottom: 8px; }
.subtitle { color: #718096; font-size: 14px; margin-bottom: 24px; }
.input-area { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
input { padding: 10px 16px; font-size: 18px; border: 2px solid #e2e8f0; border-radius: 10px; width: 120px; text-align: center; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #4299e1; }
button { padding: 10px 24px; font-size: 16px; background: #4299e1; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #3182ce; }
#writer-target { width: 300px; height: 300px; margin: 0 auto 16px; border: 2px solid #e2e8f0; border-radius: 12px; background: #fafafa; }
.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.controls button { background: #edf2f7; color: #2d3748; }
.controls button:hover { background: #e2e8f0; }
.examples { margin-top: 24px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
.examples-title { font-size: 13px; color: #a0aec0; margin-bottom: 10px; }
.examples-btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.examples-btns button { padding: 6px 14px; font-size: 20px; background: #f7fafc; border: 1px solid #e2e8f0; border-radius: 8px; cursor: pointer; min-width: 44px; }
.examples-btns button:hover { background: #e2e8f0; }
#pinyin-row { margin: 0 auto 8px; max-width: 100%; overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding: 4px 0; }
#pinyin-row::-webkit-scrollbar { display: none; }
.py-cell { display: inline-flex; flex-direction: column; align-items: center; min-width: 44px; padding: 4px 6px; margin: 0 2px; border-radius: 8px; transition: all 0.3s; }
.py-cell.current { background: #ebf8ff; box-shadow: 0 0 0 2px #4299e1; }
.py-pinyin { font-size: 11px; color: #718096; line-height: 1.3; white-space: nowrap; }
.py-cell.current .py-pinyin { color: #2b6cb0; font-weight: 700; }
.py-char { font-size: 22px; color: #2d3748; line-height: 1.4; }
.py-cell.current .py-char { color: #2b6cb0; }
.status { margin-top: 12px; font-size: 13px; color: #a0aec0; }
</style>
</head>
<body>

<div class="container">
<h1>汉字笔画演示</h1>
<p class="subtitle">输入汉字，查看标准笔画顺序</p>

<div class="input-area">
  <input type="text" id="char-input" value="阳光" placeholder="输入汉字或句子">
  <button id="show-btn">显示</button>
</div>

<div id="pinyin-row"></div>
<div id="writer-target"></div>

<div class="controls">
  <button id="pause-btn">暂停</button>
  <button id="resume-btn">继续</button>
  <button id="loop-btn">循环</button>
</div>

<div class="examples">
  <div class="examples-title">常用字快速查看</div>
  <div class="examples-btns" id="examples-btns">
    <button>阳</button><button>光</button><button>明</button>
    <button>学</button><button>习</button><button>大</button>
    <button>中</button><button>人</button><button>水</button>
    <button>火</button><button>山</button><button>花</button>
    <button>鸟</button><button>马</button><button>龙</button>
  </div>
</div>

<div class="status" id="status">提示：点击示例字查看笔画动画</div>
</div>

<script src="hanzi-writer.min.js"></script>
<script src="char-data-inline.js"></script>
<script>
(function() {
  var writer = null;
  var charQueue = [];
  var queueIndex = 0;
  var pinyinCache = {};

  var PY_URL = 'https://cdn.jsdelivr.net/gh/mapull/chinese-dictionary@master/character/common/char_common_base.json';

  function getPinyin(char, callback) {
    if (PINYIN_DATA[char]) {
      callback(PINYIN_DATA[char]);
      return;
    }
    if (pinyinCache[char]) {
      callback(pinyinCache[char]);
      return;
    }
    if (pinyinCache._fetching) {
      var check = setInterval(function() {
        if (pinyinCache[char]) {
          clearInterval(check);
          callback(pinyinCache[char]);
        }
      }, 100);
      return;
    }
    pinyinCache._fetching = true;
    fetch(PY_URL)
      .then(function(r) { return r.text(); })
      .then(function(text) {
        var lines = text.split('\n');
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim().replace(/,$/, '');
          if (!line || line === '[' || line === ']') continue;
          try {
            var item = JSON.parse(line);
            pinyinCache[item.char] = item.pinyin;
          } catch(e) {}
        }
        delete pinyinCache._fetching;
        callback(pinyinCache[char] || []);
      })
      .catch(function() {
        delete pinyinCache._fetching;
        callback([]);
      });
  }

  function updatePinyinRow() {
    var row = document.getElementById('pinyin-row');
    if (charQueue.length === 0) { row.innerHTML = ''; return; }
    var html = '';
    for (var i = 0; i < charQueue.length; i++) {
      var c = charQueue[i];
      var py = PINYIN_DATA[c] || pinyinCache[c] || [];
      var pyText = py.length ? py.join(' / ') : '&#160;';
      var cls = i === queueIndex ? 'py-cell current' : 'py-cell';
      html += '<span class="' + cls + '">' +
        '<span class="py-pinyin">' + pyText + '</span>' +
        '<span class="py-char">' + c + '</span>' +
        '</span>';
    }
    row.innerHTML = html;
    if (queueIndex >= 0 && queueIndex < charQueue.length) {
      var cells = row.querySelectorAll('.py-cell');
      if (cells[queueIndex]) cells[queueIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  function displayNext() {
    if (queueIndex >= charQueue.length) {
      document.getElementById('status').textContent = '完成！共 ' + charQueue.length + ' 字';
      writer = null;
      return;
    }

    var char = charQueue[queueIndex];
    var target = document.getElementById('writer-target');
    target.innerHTML = '';
    writer = null;
    document.getElementById('status').textContent = '加载 ' + char + ' 的数据...';

    var data = CHAR_DATA[char];
    if (data) {
      renderWithData(char, data);
    } else {
      document.getElementById('status').textContent = '加载 ' + char + '（在线）...';
      fetch('https://unpkg.com/hanzi-writer-data@2.0.1/' + encodeURIComponent(char) + '.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          renderWithData(char, d);
        })
        .catch(function() {
          document.getElementById('status').textContent = '暂无 "' + char + '" 的笔画数据，跳过';
          queueIndex++;
          updatePinyinRow();
          setTimeout(displayNext, 500);
        });
    }
  }

  function renderWithData(char, data) {
    var c = char;
    getPinyin(c, function(py) {
      var pyText = py.length ? py.join(' / ') : '';
      updatePinyinRow();
    });
    try {
      writer = HanziWriter.create('writer-target', char, {
        charDataLoader: function(c, onLoad) { onLoad(data); },
        width: 300,
        height: 300,
        padding: 20,
        strokeColor: '#4299e1',
        radicalColor: '#e53e3e',
        strokeAnimationSpeed: 1.5,
        showCharacter: true,
      });

      var total = data.strokes.length;
      var label = queueIndex + 1;
      document.getElementById('status').textContent = label + '/' + charQueue.length + ' ' + char + '（' + total + ' 画）';

      writer.animateCharacter({
        onComplete: function() {
          queueIndex++;
          setTimeout(displayNext, 600);
        }
      });
    } catch(e) {
      document.getElementById('status').textContent = '错误：' + e.message;
      queueIndex++;
      updatePinyinRow();
      setTimeout(displayNext, 500);
    }
  }

  function startQueue(text) {
    var chars = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (c >= '\u4e00' && c <= '\u9fff') {
        chars.push(c);
      }
    }
    if (chars.length === 0) {
      document.getElementById('status').textContent = '未找到汉字';
      return;
    }
    charQueue = chars;
    queueIndex = 0;
    document.getElementById('char-input').value = text;
    updatePinyinRow();
    displayNext();
  }

  document.addEventListener('DOMContentLoaded', function() {
    var input = document.getElementById('char-input');
    var showBtn = document.getElementById('show-btn');

    showBtn.addEventListener('click', function() {
      var val = input.value.trim();
      if (val) startQueue(val);
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var val = input.value.trim();
        if (val) startQueue(val);
      }
    });

    document.getElementById('pause-btn').addEventListener('click', function() {
      if (writer) writer.pauseAnimation();
    });

    document.getElementById('resume-btn').addEventListener('click', function() {
      if (writer) writer.resumeAnimation();
    });

    document.getElementById('loop-btn').addEventListener('click', function() {
      if (!writer) return;
      var btn = this;
      var looping = btn.textContent !== '循环';
      btn.textContent = looping ? '循环' : '循环中...';
      btn.style.background = looping ? '' : '#c6f6d5';
      looping ? writer.loopCharacterAnimation() : writer.pauseAnimation();
    });

    document.getElementById('examples-btns').addEventListener('click', function(e) {
      if (e.target.tagName === 'BUTTON') startQueue(e.target.textContent);
    });

    startQueue('阳光');
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
