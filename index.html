<title>汉字笔画演示 - 宝宝学汉字</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4299e1">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
.container { background: #fff; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); text-align: center; max-width: 600px; width: 90%; }
h1 { font-size: 24px; color: #2d3748; margin-bottom: 8px; }
.subtitle { color: #718096; font-size: 14px; margin-bottom: 24px; }
.input-area { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
input { padding: 10px 16px; font-size: 18px; border: 2px solid #e2e8f0; border-radius: 10px; width: 120px; text-align: center; outline: none; transition: border-color 0.2s; }
input:focus { border-color: #4299e1; }
button { padding: 10px 24px; font-size: 16px; background: #4299e1; color: #fff; border: none; border-radius: 10px; cursor: pointer; transition: background 0.2s; }
button:hover { background: #3182ce; }
#writer-target { width: 300px; height: 300px; margin: 0 auto 16px; border: 2px solid #e2e8f0; border-radius: 12px; background: #fafafa; }
.controls { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.controls button { background: #edf2f7; color: #2d3748; }
.controls button:hover { background: #e2e8f0; }

#pinyin-row { margin: 0 auto 8px; max-width: 100%; overflow-x: auto; overflow-y: hidden; white-space: nowrap; padding: 4px 0; }
#pinyin-row::-webkit-scrollbar { display: none; }
.py-cell { display: inline-flex; flex-direction: column; align-items: center; min-width: 44px; padding: 4px 6px; margin: 0 2px; border-radius: 8px; transition: all 0.3s; }
.py-cell.current { background: #ebf8ff; box-shadow: 0 0 0 2px #4299e1; }
.py-pinyin { font-size: 13px; color: #718096; line-height: 1.4; white-space: nowrap; }
.py-pinyin-all { font-size: 12px; color: #a0aec0; }
.py-cell.current .py-pinyin { color: #2b6cb0; font-weight: 700; }
.py-char { font-size: 22px; color: #2d3748; line-height: 1.4; }
.py-cell.current .py-char { color: #2b6cb0; }
.status { margin-top: 12px; font-size: 13px; color: #a0aec0; }
#stroke-info { font-size: 14px; color: #4a5568; margin-bottom: 6px; min-height: 21px; }
.speed-selector { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
.speed-selector button { padding: 4px 14px; font-size: 13px; background: #edf2f7; color: #4a5568; border: 2px solid transparent; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
.speed-selector button:hover { background: #e2e8f0; }
.speed-selector button.active { background: #ebf8ff; border-color: #4299e1; color: #2b6cb0; font-weight: 700; }

.popup-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.3); z-index: 1000; justify-content: center; align-items: center; }
.popup-overlay.open { display: flex; }
.popup-box { background: #fff; border-radius: 16px; padding: 24px; max-width: 320px; width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); text-align: center; }
.popup-char { font-size: 48px; color: #2d3748; margin-bottom: 4px; }
.popup-scope { font-size: 12px; color: #a0aec0; margin-bottom: 16px; }
.popup-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.popup-options button { padding: 10px; font-size: 16px; background: #f7fafc; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: all 0.2s; color: #2d3748; }
.popup-options button:hover { border-color: #4299e1; background: #ebf8ff; }
.popup-options button.selected { border-color: #4299e1; background: #ebf8ff; font-weight: 700; }
.popup-cancel { padding: 8px 20px; font-size: 14px; background: #edf2f7; color: #718096; border: none; border-radius: 8px; cursor: pointer; }
.popup-cancel:hover { background: #e2e8f0; }

.export-btn { margin-top: 8px; padding: 6px 16px; font-size: 12px; background: #edf2f7; color: #718096; border: none; border-radius: 6px; cursor: pointer; }
.export-btn:hover { background: #e2e8f0; }
.py-cell { cursor: pointer; }

.speaker-btn {
  position: absolute; top: 2px; right: 2px;
  background: rgba(0,0,0,0.06); border: none; border-radius: 50%;
  width: 20px; height: 20px; line-height: 20px;
  font-size: 11px; cursor: pointer; padding: 0;
  opacity: 0.35; transition: opacity 0.2s;
  z-index: 2;
}
.py-cell:hover .speaker-btn { opacity: 0.7; }
.speaker-btn:hover { opacity: 1 !important; background: rgba(66,153,225,0.15); }
.speaker-btn.speaking { opacity: 1; animation: speak-pulse 0.6s infinite; }
@keyframes speak-pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.25); }
}

#speaker-toggle.on { background: #c6f6d5; color: #276749; font-weight: 700; }
</style>
</head>
<body>

<div class="container">
<h1>汉字笔画演示</h1>
<p class="subtitle">输入汉字，查看标准笔画顺序</p>

<div class="input-area">
  <input type="text" id="char-input" value="阳光" placeholder="输入汉字或句子">
  <button id="show-btn">显示</button>
</div>

<div id="stroke-info"></div>
<div id="pinyin-row"></div>
<div id="writer-target"></div>

<div class="controls">
  <button id="pause-btn">暂停</button>
  <button id="resume-btn">继续</button>
  <button id="loop-btn">循环</button>
  <button id="speaker-toggle">&#x1F507; 跟读</button>
</div>

<div class="speed-selector" id="speed-selector">
  <span style="font-size:13px;color:#4a5568;line-height:34px;margin-right:6px;user-select:none;">笔画速度</span>
  <button data-speed="0.8">慢</button>
  <button data-speed="1.5" class="active">正常</button>
  <button data-speed="3.0">快</button>
  <button data-speed="5.0">极快</button>
</div>

<div class="status" id="status">等待输入...</div>
<div><button class="export-btn" id="export-btn">导出拼音修正</button></div>
</div>

<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)document.getElementById('popup-overlay').classList.remove('open')">
  <div class="popup-box">
    <div class="popup-char" id="popup-char"></div>
    <div class="popup-scope" id="popup-scope"></div>
    <div class="popup-options" id="popup-options"></div>
    <button class="popup-cancel" onclick="document.getElementById('popup-overlay').classList.remove('open')">取消</button>
  </div>
</div>

<script src="hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.28.1/dist/index.js"></script>
<script src="char-data-inline.js"></script>
<script>
(function() {
  var writer = null;
  var charQueue = [];
  var queuePinyin = [];
  var queueIndex = 0;
  var busy = false;
  var cancelId = 0;
  var strokeSpeed = 1.5;
  var currentText = '';
  var longPressTimer = null;
  var autoSpeak = false;

  function getPinyinFallback(char) {
    if (PINYIN_DATA[char]) return PINYIN_DATA[char].join(' / ');
    return char;
  }

  function computeQueuePinyin(text, chars) {
    if (window.pinyinPro) {
      try {
        var fullText = text;
        var surnameOpt = 'off';
        if (fullText.length >= 2 && fullText.length <= 4) {
          var nonCjk = 0;
          for (var si2 = 0; si2 < fullText.length; si2++) {
            if (!(fullText[si2] >= '\u4e00' && fullText[si2] <= '\u9fff')) nonCjk++;
          }
          if (nonCjk === 0) surnameOpt = 'head';
        }
        var allData = window.pinyinPro.pinyin(text, { toneType: 'tone', type: 'all', segmentit: 2, surname: surnameOpt });

        var isSingleInput = chars.length <= 1;
        var result = [];
        for (var ti = 0; ti < text.length && ti < allData.length; ti++) {
          if (text[ti] >= '\u4e00' && text[ti] <= '\u9fff') {
            var d = allData[ti];
            var isPoly = d.polyphonic && d.polyphonic.length > 1;
            result.push({
              result: d.result,
              polyphonic: d.polyphonic || [],
              isPoly: isPoly,
              disambiguated: !isSingleInput
            });
          }
        }
        return result;
      } catch(e) { console.error('pinyin-pro error:', e); }
    }
    var fallback = [];
    for (var i = 0; i < chars.length; i++) {
      fallback.push({ result: getPinyinFallback(chars[i]), polyphonic: [], isPoly: false, disambiguated: true });
    }
    return fallback;
  }

  function formatPinyinCell(info) {
    if (!info.isPoly) {
      return '<span class="py-pinyin">' + (info.result || '&#160;') + '</span>';
    }
    if (info.disambiguated) {
      return '<span class="py-pinyin">' + info.result + '</span>';
    }
    var allHtml = '';
    for (var k = 0; k < info.polyphonic.length; k++) {
      if (k > 0) allHtml += '<span class="py-pinyin-all"> / </span>';
      var cls = info.polyphonic[k] === info.result ? 'py-pinyin' : 'py-pinyin-all';
      allHtml += '<span class="' + cls + '">' + info.polyphonic[k] + '</span>';
    }
    return allHtml;
  }

  function updatePinyinRow() {
    var row = document.getElementById('pinyin-row');
    if (charQueue.length === 0) { row.innerHTML = ''; return; }
    var html = '';
    for (var i = 0; i < charQueue.length; i++) {
      var info = queuePinyin[i] || { result: '&#160;', isPoly: false, polyphonic: [] };
      var cls = i === queueIndex ? 'py-cell current' : 'py-cell';
      html += '<span class="' + cls + '" style="position:relative;">' +
        formatPinyinCell(info) +
        '<button class="speaker-btn" data-char="' + charQueue[i] + '">&#x1F508;</button>' +
        '<span class="py-char">' + charQueue[i] + '</span>' +
        '</span>';
    }
    row.innerHTML = html;
    if (queueIndex >= 0 && queueIndex < charQueue.length) {
      var cells = row.querySelectorAll('.py-cell');
      if (cells[queueIndex]) cells[queueIndex].scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }
  }

  function loadPinyinFixes() {
    try {
      var saved = localStorage.getItem('pinyin_fixes');
      if (saved && window.pinyinPro && window.pinyinPro.customPinyin) {
        var fixes = JSON.parse(saved);
        var toApply = {};
        for (var k in fixes) {
          if (Object.prototype.hasOwnProperty.call(fixes, k)) toApply[k] = fixes[k];
        }
        if (Object.keys(toApply).length > 0) {
          window.pinyinPro.customPinyin(toApply);
        }
      }
    } catch(e) {}
  }

  function speakChar(char) {
    if (!window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      window.speechSynthesis.resume();
      var u = new SpeechSynthesisUtterance(char);
      u.lang = 'zh-CN';
      u.rate = 1.0;
      u.volume = 1.0;
      var voices = window.speechSynthesis.getVoices();
      for (var i = 0; i < voices.length; i++) {
        if (voices[i].lang.startsWith('zh')) { u.voice = voices[i]; break; }
      }
      setTimeout(function() {
        try { speechSynthesis.speak(u); } catch(e) {}
      }, 50);
    } catch(e) {}
  }

  function findSegmentForIndex(text, charIdx) {
    if (!window.pinyinPro) return null;
    var segs = window.pinyinPro.segment(text);
    var pos = 0;
    for (var si = 0; si < segs.length; si++) {
      var segText = segs[si].origin;
      var segLen = 0;
      for (var ci = 0; ci < segText.length; ci++) {
        if (segText[ci] >= '\u4e00' && segText[ci] <= '\u9fff') segLen++;
      }
      if (charIdx >= pos && charIdx < pos + segLen) {
        return { text: segText, offsetInSeg: charIdx - pos };
      }
      pos += segLen;
    }
    return null;
  }

  function showCorrectionPopup(charIndex) {
    var info = queuePinyin[charIndex];
    if (!info || !info.isPoly) return;

    var segInfo = findSegmentForIndex(currentText, charIndex);
    if (!segInfo) return;

    var segText = segInfo.text;
    var char = charQueue[charIndex];

    document.getElementById('popup-char').textContent = char;
    document.getElementById('popup-scope').textContent = '修正在：' + segText;

    var optionsHtml = '';
    for (var pi = 0; pi < info.polyphonic.length; pi++) {
      var py = info.polyphonic[pi];
      var selected = py === info.result ? ' selected' : '';
      optionsHtml += '<button class="popup-option' + selected + '" data-pinyin="' + py + '">' + py + '</button>';
    }
    var optionsDiv = document.getElementById('popup-options');
    optionsDiv.innerHTML = optionsHtml;

    optionsDiv.querySelectorAll('.popup-option').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var selectedPy = this.getAttribute('data-pinyin');
        savePinyinFix(segText, charIndex, selectedPy);
      });
    });

    document.getElementById('popup-overlay').classList.add('open');
  }

  function savePinyinFix(segText, charIndex, selectedPy) {
    if (!window.pinyinPro) return;

    var segPinyin = window.pinyinPro.pinyin(segText, { toneType: 'tone', type: 'array' });
    var cjkCount = 0;
    for (var ci = 0; ci < segText.length; ci++) {
      if (segText[ci] >= '\u4e00' && segText[ci] <= '\u9fff') cjkCount++;
    }
    var segInfo = findSegmentForIndex(currentText, charIndex);
    var offset = segInfo ? segInfo.offsetInSeg : 0;

    var corrected = [];
    var pyIdx = 0;
    for (var ch = 0; ch < segText.length; ch++) {
      if (segText[ch] >= '\u4e00' && segText[ch] <= '\u9fff') {
        corrected.push(pyIdx === offset ? selectedPy : segPinyin[pyIdx]);
        pyIdx++;
      }
    }
    var newPinyinStr = corrected.join(' ');

    // Save to localStorage
    try {
      var fixes = {};
      var existing = localStorage.getItem('pinyin_fixes');
      if (existing) fixes = JSON.parse(existing);
      fixes[segText] = newPinyinStr;
      localStorage.setItem('pinyin_fixes', JSON.stringify(fixes));

      window.pinyinPro.customPinyin(fixes);
    } catch(e) {}

    document.getElementById('popup-overlay').classList.remove('open');
    // Recompute and refresh
    queuePinyin = computeQueuePinyin(currentText, charQueue);
    updatePinyinRow();
  }

  function displayNext() {
    if (busy) return;
    var myId = ++cancelId;

    if (queueIndex >= charQueue.length) {
      document.getElementById('status').textContent = '完成！共 ' + charQueue.length + ' 字';
      writer = null;
      return;
    }

    var char = charQueue[queueIndex];
    if (autoSpeak) speakChar(char);
    var target = document.getElementById('writer-target');
    target.innerHTML = '';
    if (writer) { try { writer.cancelAnimation(); } catch(e) {} writer = null; }
    document.getElementById('status').textContent = '加载 ' + char + ' 的数据...';

    var data = CHAR_DATA[char];
    if (data) {
      renderWithData(char, data, myId);
    } else {
      document.getElementById('status').textContent = '加载 ' + char + '（在线）...';
      busy = true;
      fetch('https://unpkg.com/hanzi-writer-data@2.0.1/' + encodeURIComponent(char) + '.json')
        .then(function(r) { return r.json(); })
        .then(function(d) {
          if (cancelId !== myId) return;
          busy = false;
          renderWithData(char, d, myId);
        })
        .catch(function() {
          if (cancelId !== myId) return;
          busy = false;
          document.getElementById('status').textContent = '暂无 "' + char + '" 的笔画数据，跳过';
          queueIndex++;
          updatePinyinRow();
          setTimeout(displayNext, 500);
        });
    }
  }

  function renderWithData(char, data, myId) {
    busy = true;

    try {
      writer = HanziWriter.create('writer-target', char, {
        charDataLoader: function(c, onLoad) { onLoad(data); },
        width: 300,
        height: 300,
        padding: 20,
        strokeColor: '#4299e1',
        radicalColor: '#e53e3e',
        strokeAnimationSpeed: strokeSpeed,
        delayBetweenStrokes: 1000 / strokeSpeed,
        showCharacter: true,
      });

      var total = data.strokes.length;
      var label = queueIndex + 1;
      document.getElementById('stroke-info').textContent = label + '/' + charQueue.length + ' · ' + total + ' 画';
      document.getElementById('status').textContent = '';
      updatePinyinRow();

      writer.animateCharacter({
        onComplete: function() {
          if (cancelId !== myId) return;
          busy = false;
          queueIndex++;
          setTimeout(function() { displayNext(); }, 600);
        }
      });
    } catch(e) {
      if (cancelId !== myId) return;
      busy = false;
      document.getElementById('status').textContent = '错误：' + e.message;
      queueIndex++;
      updatePinyinRow();
      setTimeout(displayNext, 500);
    }
  }

  function startQueue(text) {
    if (window.speechSynthesis) speechSynthesis.cancel();
    if (writer) { try { writer.cancelAnimation(); } catch(e) {} writer = null; }
    cancelId++;
    busy = false;

    currentText = text;
    var chars = [];
    for (var i = 0; i < text.length; i++) {
      var c = text.charAt(i);
      if (c >= '\u4e00' && c <= '\u9fff') {
        chars.push(c);
      }
    }
    if (chars.length === 0) {
      document.getElementById('status').textContent = '未找到汉字';
      return;
    }
    charQueue = chars;
    queueIndex = 0;
    document.getElementById('char-input').value = text;
    queuePinyin = computeQueuePinyin(text, chars);
    updatePinyinRow();
    setTimeout(function() { displayNext(); }, 100);
  }

  document.addEventListener('DOMContentLoaded', function() {
    if (window.pinyinPro && window.pinyinPro.customPinyin) {
      window.pinyinPro.customPinyin({
        '朝三暮四': 'zhāo sān mù sì',
        '朝秦暮楚': 'zhāo qín mù chǔ',
        '单于': 'chán yú',
      });
    }

    var input = document.getElementById('char-input');
    var showBtn = document.getElementById('show-btn');

    showBtn.addEventListener('click', function() {
      var val = input.value.trim();
      if (val) startQueue(val);
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var val = input.value.trim();
        if (val) startQueue(val);
      }
    });

    document.getElementById('pause-btn').addEventListener('click', function() {
      if (writer) writer.pauseAnimation();
    });

    document.getElementById('resume-btn').addEventListener('click', function() {
      if (writer) writer.resumeAnimation();
    });

    document.getElementById('loop-btn').addEventListener('click', function() {
      if (!writer) return;
      var btn = this;
      var looping = btn.textContent !== '循环';
      btn.textContent = looping ? '循环' : '循环中...';
      btn.style.background = looping ? '' : '#c6f6d5';
      looping ? writer.loopCharacterAnimation() : writer.pauseAnimation();
    });

    function startLongPress(idx) {
      longPressTimer = setTimeout(function() { showCorrectionPopup(idx); }, 500);
    }
    function cancelLongPress() {
      if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    }
    document.getElementById('pinyin-row').addEventListener('mousedown', function(e) {
      var cell = e.target.closest('.py-cell');
      if (!cell) return;
      var idx = Array.prototype.indexOf.call(cell.parentNode.children, cell);
      if (idx < 0 || idx >= queuePinyin.length) return;
      startLongPress(idx);
    });
    document.getElementById('pinyin-row').addEventListener('mouseup', cancelLongPress);
    document.getElementById('pinyin-row').addEventListener('mouseleave', cancelLongPress);
    document.getElementById('pinyin-row').addEventListener('touchstart', function(e) {
      var cell = e.target.closest('.py-cell');
      if (!cell) return;
      var idx = Array.prototype.indexOf.call(cell.parentNode.children, cell);
      if (idx < 0 || idx >= queuePinyin.length) return;
      startLongPress(idx);
    }, { passive: true });
    document.getElementById('pinyin-row').addEventListener('touchend', cancelLongPress);
    document.getElementById('pinyin-row').addEventListener('touchmove', cancelLongPress);

    document.getElementById('speed-selector').addEventListener('click', function(e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var speed = parseFloat(btn.getAttribute('data-speed'));
      if (!speed) return;
      strokeSpeed = speed;
      this.querySelectorAll('button').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
    });

    document.getElementById('export-btn').addEventListener('click', function() {
      try {
        var data = localStorage.getItem('pinyin_fixes');
        if (!data || data === '{}') { alert('暂无修正记录'); return; }
        var blob = new Blob([data], { type: 'application/json' });
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'pinyin-corrections.json';
        a.click();
        URL.revokeObjectURL(url);
      } catch(e) { alert('导出失败：' + e.message); }
    });

    document.getElementById('pinyin-row').addEventListener('click', function(e) {
      var btn = e.target.closest('.speaker-btn');
      if (!btn) return;
      speakChar(btn.getAttribute('data-char'));
    });

    document.getElementById('speaker-toggle').addEventListener('click', function() {
      autoSpeak = !autoSpeak;
      this.innerHTML = autoSpeak ? '&#x1F50A; 跟读' : '&#x1F507; 跟读';
      this.classList.toggle('on', autoSpeak);
    });

    // Warm up speech engine (fix for iOS / some Android)
    if (window.speechSynthesis) {
      var wu = new SpeechSynthesisUtterance('');
      wu.volume = 0;
      try { speechSynthesis.speak(wu); speechSynthesis.cancel(); } catch(e) {}
    }

    loadPinyinFixes();
    startQueue('阳光');
  });
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
